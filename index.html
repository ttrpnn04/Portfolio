    <script>
      // ตั้งธีมก่อนวาดเฟรมแรก ไม่งั้นคนที่เลือกธีมสว่างไว้จะเห็นจอแวบดำก่อน
      // แล้วค่อยเปลี่ยนเป็นขาวหลัง React โหลดเสร็จ
      ;(function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'light' || stored === 'dark') {
            theme = stored
          } else if (matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light'
          }
        } catch {
          // โหมดส่วนตัวของบางเบราว์เซอร์ห้ามอ่าน localStorage — ใช้ธีมมืดไปก่อน
          theme = 'dark'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
